[project]
name = "useeventstack"
version = "0.3.0"
description = "Python SDK for useEventStack — the Operational OS for Company Behavior"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["useeventstack", "events", "event-sourcing", "workflows", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://useeventstack.com"
Documentation = "https://useeventstack.com/docs/python-sdk"
Repository = "https://github.com/useeventstack/sdk-python"
Issues = "https://github.com/useeventstack/sdk-python/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["useeventstack"]
